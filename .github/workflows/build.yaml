name: Build bitbake Debian Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # 12 AM UTC
  workflow_dispatch:

jobs:
  debian-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            devscripts \
            debhelper \
            python3 \
            xz-utils

      - name: Clone bitbake
        run: | 
          git clone https://github.com/openembedded/bitbake.git bitbake

      - name: Create Source Tarball
        run: |
          # We use the version from your changelog to name the tarball correctly
          VERSION=$(dpkg-parsechangelog -S Version | sed 's/-.*//')
          PACKAGE=$(dpkg-parsechangelog -S Source)
          
          tar --exclude=.git -cJf ../${PACKAGE}_${VERSION}.tar.xz .
          
          echo "Tarball created: ../${PACKAGE}_${VERSION}.tar.xz"

      - name: Build Package
        run: |
          debuild -us -uc

      - name: Prepare for upload
        run: |
          mkdir artifacts
          mv ../*.deb artifacts/
          mv ../*.dsc artifacts/ 2>/dev/null || true
          mv ../*.changes artifacts/ 2>/dev/null || true
          mv ../*.tar.xz artifacts/ 2>/dev/null || true
          mv ../*.buildinfo artifacts/ 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitbake-setup-package
          path: artifacts/

  lintian:
    needs: debian-build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Install Lintian
        run: |
          sudo apt update
          sudo apt install -y lintian

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bitbake-setup-package
          path: ./dist

      - name: Run Lintian Checks
        run: |
          # Lintian checks a .changes file which lists all build artifacts
          CHANGES_FILE=$(find . -name "*.changes" -type f)
          
          if [ -z "$CHANGES_FILE" ]; then
            echo "Error: No .changes file found"
            exit 1
          fi
          
          echo "Running lintian on $CHANGES_FILE"
          lintian -i "$CHANGES_FILE"

      - name: Report Results
        if: success()
        run: |
          echo "✓ Lintian checks passed"

  test:
    needs: debian-build  # Only run if the build job succeeds
    runs-on: ubuntu-latest
    steps:
      
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: bitbake-setup-package
          path: ./dist

      - name: Install Package
        run: |
          # Use apt to install the local .deb so it handles dependencies (like python3)
          sudo apt update
          sudo apt install -y ./dist/*.deb

      - name: Sanity Test - Execution
        run: |
          # Verify the binary is in the PATH
          which bitbake-setup
          # Verify wrapper is linked
          ls -l /usr/bin/bitbake-setup
          # Run the help command to ensure Python and dependencies are working
          bitbake-setup --help

      - name: Sanity Test - Manpage
        run: |
          # Verify the manpage was installed correctly
          man -w bitbake-setup

      - name: Sanity Test - Usage
        run: |
          # Verify list
          bitbake-setup list
          # Verify non-interactive init
          bitbake-setup init --non-interactive oe-nodistro-master nodistro machine/qemux86-64
